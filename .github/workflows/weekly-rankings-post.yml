name: Weekly PRIME 25 rankings post

# Runs after a successful ratings/metrics refresh and only acts on Sundays in
# America/Detroit. The refresh workflow runs roughly hourly. That cadence is
# intentional: freshness + dedupe make repeats no-ops, while a transient
# failure before the 3:00 PM ET publish slot can self-heal on the next run.
#
# For a genuinely new PRIME 25 release, this workflow:
#   1. generates that week's data-backed caption and PNG,
#   2. uploads the PNG to Supabase Storage,
#   3. creates an exact-time Buffer post for Sunday at 3:00 PM ET.
#
# Buffer owns the actual timed publish to X. If the intended 3 PM window has
# already passed, schedule_social_post.py refuses to schedule anything late.

on:
  workflow_run:
    workflows: ["Refresh 2026 ratings and metrics"]
    types: [completed]

permissions:
  contents: read

jobs:
  generate-and-schedule-rankings-post:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check day of week (America/Detroit)
        id: check_day
        run: |
          today=$(TZ=America/Detroit date +%u)  # 1=Monday ... 7=Sunday
          if [ "$today" = "7" ]; then
            echo "is_sunday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_sunday=false" >> "$GITHUB_OUTPUT"
            echo "Not Sunday in America/Detroit; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.check_day.outputs.is_sunday == 'true'

      - uses: actions/setup-python@v5
        if: steps.check_day.outputs.is_sunday == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with social extras
        if: steps.check_day.outputs.is_sunday == 'true'
        run: pip install -e ".[social]"

      - name: Generate fresh PRIME 25 social candidate
        id: generate
        if: steps.check_day.outputs.is_sunday == 'true'
        env:
          SUPABASE_URL: https://wmlzqmtsxqqxuiekmrqm.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/generate_rankings_post.py

      - name: Schedule fresh candidate in Buffer for 3 PM ET
        if: steps.check_day.outputs.is_sunday == 'true'
        env:
          SUPABASE_URL: https://wmlzqmtsxqqxuiekmrqm.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          SOCIAL_POST_ID: ${{ steps.generate.outputs.social_post_id }}
        run: |
          if [ -z "$SOCIAL_POST_ID" ]; then
            echo "No fresh rankings candidate was generated on this refresh; nothing to schedule."
            exit 0
          fi
          python scripts/schedule_social_post.py "$SOCIAL_POST_ID"

      - name: Upload rendered PNG as a workflow artifact
        if: steps.check_day.outputs.is_sunday == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rankings-post-png
          path: build/social/**/*.png
          if-no-files-found: ignore
          retention-days: 90
