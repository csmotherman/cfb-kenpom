name: Apply advanced margin view

on:
  push:
    branches: [advanced-table-polish]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: advanced-table-polish
      - name: Apply margin view
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit margin view
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/advanced/page.tsx
          git commit -m "Replace both view with offense-defense margin"
          git push origin advanced-table-polish
