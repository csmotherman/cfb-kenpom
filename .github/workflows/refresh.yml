name: Refresh 2026 ratings and metrics

on:
  schedule:
    # New-game detection is intentionally cheap: it only checks CFBD game
    # metadata. Run it hourly so a game that CFBD marks complete after midnight
    # is picked up on the next pass instead of leaving the site stale all day.
    # Minute 17 avoids the busiest top-of-hour GitHub Actions scheduling window.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-rankings-data
  cancel-in-progress: false

permissions:
  contents: write

env:
  SEASON: "2026"
  CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
  SUPABASE_URL: https://wmlzqmtsxqqxuiekmrqm.supabase.co
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Allow hourly and manual new-game checks
        id: gate
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Running new-game detection. The expensive refresh remains gated on finding a newly completed game." >> "$GITHUB_STEP_SUMMARY"

  detect-new-games:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      new_games: ${{ steps.detect.outputs.new_games }}
      new_game_count: ${{ steps.detect.outputs.new_game_count }}
      new_game_ids: ${{ steps.detect.outputs.new_game_ids }}
      refresh_partitions: ${{ steps.detect.outputs.refresh_partitions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Check CFBD for newly completed games
        id: detect
        run: python scripts/check_new_games.py --season "$SEASON"
      - name: Record no-op decision
        if: steps.detect.outputs.new_games != 'true'
        run: |
          echo "No new completed 2026 games were found. PBP, ratings, metrics, Supabase, Git, and Vercel were not touched." >> "$GITHUB_STEP_SUMMARY"

  refresh:
    needs: [schedule-gate, detect-new-games]
    if: needs.schedule-gate.outputs.should_run == 'true' && needs.detect-new-games.outputs.new_games == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[models]'

      # Restore the previous raw/processed 2026 corpus. If a cache is absent,
      # the targeted ingest command below hydrates missing partitions before it
      # refreshes the partitions that contain the newly completed games.
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
          key: cfb-kenpom-data-v3-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: |
            cfb-kenpom-data-v3-${{ env.SEASON }}-
            cfb-kenpom-data-v2-${{ env.SEASON }}-

      # Historical Advanced payloads are needed only once a real refresh is
      # warranted. Hydration is bounded to one Supabase season per request and
      # retries transient server errors; a no-game run never contacts Supabase.
      - name: Hydrate private premium history
        run: python scripts/hydrate_premium_data.py
      - name: Test publication gates
        run: python -m unittest discover -s tests

      # Refresh only the raw CFBD week partitions that actually contain new
      # completed games. This downloads authoritative games, drives and PBP for
      # those partitions; verified historical partitions remain cached.
      - name: Fetch games, drives and play-by-play for new games
        env:
          REFRESH_PARTITIONS: ${{ needs.detect-new-games.outputs.refresh_partitions }}
          NEW_GAME_COUNT: ${{ needs.detect-new-games.outputs.new_game_count }}
        run: |
          args=()
          for partition in $REFRESH_PARTITIONS; do
            args+=(--refresh-partition "$partition")
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "New games were reported but no source partitions were resolved." >&2
            exit 1
          fi
          echo "Refreshing $NEW_GAME_COUNT newly completed game(s) in: $REFRESH_PARTITIONS"
          python -m cfb_analytics.pipelines.ingest --season "$SEASON" "${args[@]}"

      # From this point forward the complete 2026 season is rebuilt from the
      # refreshed raw corpus so every downstream metric/rating is internally
      # consistent with all games processed to date.
      - name: Clean and materialize canonical plays
        run: python -m cfb_analytics.raw.cli canonical-plays --season "$SEASON"
      - name: Materialize derived drives
        run: python -m cfb_analytics.raw.cli derived-drives --season "$SEASON"
      - name: Refresh FBS membership facts
        run: python -m cfb_analytics.pipelines.ingest_facts --season "$SEASON" --force
      - name: Derive all 2026 metrics
        run: python -m cfb_analytics.pipelines.calculate_metrics --season "$SEASON"
      - name: Propagate dropback metrics
        run: python -m cfb_analytics.analytics.dropback_propagation_cli propagate --season "$SEASON"
      - name: Propagate yardage metrics
        run: python -m cfb_analytics.derived.basic_yardage_propagation_cli materialize --season "$SEASON"
      - name: Propagate havoc metrics
        run: python -m cfb_analytics.derived.havoc_propagation_cli materialize --season "$SEASON"
      - name: Rebuild canonical 2026 team games
        run: python -m cfb_analytics.pipelines.build_canonical --season "$SEASON"
      - name: Recompute 2026 ratings
        run: python -m cfb_analytics.pipelines.calculate_ratings --season "$SEASON"
      - name: Compile 2026 hierarchical HFA ratings and Advanced metrics
        run: python scripts/compile_site_data.py --season "$SEASON" --rating-model hierarchical_hfa

      - name: Score weekly predictions
        run: python -m cfb_analytics.pipelines.weekly_predictions
      - name: Score early-season predictions
        run: python -m cfb_analytics.pipelines.early_season_predictions publish
      - name: Export Next.js data
        run: python scripts/export_web_data.py
      - name: Audit every published season
        run: python scripts/validate_site_data.py
      # A newer, more experimental piece of the pipeline (a 2,000-trial Monte
      # Carlo CFP simulation) than everything above -- a failure here must
      # never block the core ratings/predictions refresh from publishing.
      - name: Publish live CFP chance into Advanced Analytics
        run: python scripts/publish_cfp_chance.py --season "$SEASON"
        continue-on-error: true
      - name: Publish refreshed 2026 premium data to Supabase
        run: python scripts/publish_premium_data.py --season "$SEASON"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run build
        working-directory: web

      - name: Remove private build artifacts
        run: |
          rm -f site/advanced-data.js
          rm -rf web/public/data/advanced web/public/data/predictions

      - name: Commit validated 2026 changes
        id: publish
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          NEW_GAME_COUNT: ${{ needs.detect-new-games.outputs.new_game_count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "prospective/$SEASON/predictions"
          git add "data/canonical/season=$SEASON" site/data.js site/search-index.js web/public/data "prospective/$SEASON/predictions"
          if git diff --staged --quiet; then
            echo "New games were detected, but the validated public output did not change." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh $SEASON ratings after $NEW_GAME_COUNT new game(s)"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Published refreshed $SEASON ratings and metrics after $NEW_GAME_COUNT new completed game(s)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify Vercel of refreshed data
        if: steps.publish.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 -X POST "$DEPLOY_HOOK" --output /dev/null
          fi