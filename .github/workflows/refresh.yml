name: Refresh rankings data

on:
  schedule:
    # Every 4 hours, Sun-Fri (day-of-week: 0=Sun ... 6=Sat)
    - cron: "5 */4 * * 0-5"
    # Every hour on Saturday (game day)
    - cron: "5 * * * 6"
  workflow_dispatch:
    inputs:
      season:
        description: Season to refresh
        required: true
        default: "2026"

concurrency:
  group: refresh-rankings-data
  cancel-in-progress: false

permissions:
  contents: write

env:
  SEASON: ${{ github.event.inputs.season || '2026' }}
  CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
  CFBD_PREDICTIONS_TOKEN: ${{ secrets.CFBD_PREDICTIONS_TOKEN }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e '.[models]'

      - name: Restore raw/processed cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
          key: cfb-kenpom-data-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: |
            cfb-kenpom-data-${{ env.SEASON }}-

      - name: Ingest raw CFBD data
        run: python -m cfb_analytics.pipelines.ingest --season ${{ env.SEASON }}

      - name: Materialize canonical plays
        run: python -m cfb_analytics.raw.cli canonical-plays --season ${{ env.SEASON }}

      - name: Materialize derived drives
        run: python -m cfb_analytics.raw.cli derived-drives --season ${{ env.SEASON }}

      - name: Ingest FBS membership facts
        run: python -m cfb_analytics.pipelines.ingest_facts --season ${{ env.SEASON }}

      - name: Derive per-game/per-season metrics
        run: python -m cfb_analytics.pipelines.calculate_metrics --season ${{ env.SEASON }}

      # dropbacks/rushAttempts/basic-yardage counts aren't computed by
      # calculate_metrics -- these two propagation scripts back them into
      # the derived team_games/team_seasons JSON before canonical picks it
      # up, same as was done by hand for every prior season (2014-2025).
      - name: Propagate dropback/sack metrics
        run: python -m cfb_analytics.analytics.dropback_propagation_cli propagate --season ${{ env.SEASON }}

      - name: Propagate basic yardage metrics
        run: python -m cfb_analytics.derived.basic_yardage_propagation_cli materialize --season ${{ env.SEASON }}

      - name: Build canonical identity + team_games
        run: python -m cfb_analytics.pipelines.build_canonical --season ${{ env.SEASON }}

      - name: Compute iterative (SRS) ratings
        run: python -m cfb_analytics.pipelines.calculate_ratings --season ${{ env.SEASON }}

      # Replace only the requested season in the published site payload. The
      # compiler preserves historical seasons and refuses to publish a season
      # if the generated final week contains teams but zero calculated ratings.
      - name: Rebuild rankings table + advanced analytics data
        run: python scripts/compile_site_data.py --season ${{ env.SEASON }}

      # Re-shapes the same generated site/data.js + site/advanced-data.js into
      # per-season JSON for the Next.js app (web/) to fetch() at runtime.
      - name: Export per-season JSON for the Next.js app
        run: python scripts/export_web_data.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "cfb-kenpom-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/canonical site/data.js site/advanced-data.js web/public/data
          if git diff --staged --quiet; then
            echo "No valid data changes; skipping commit."
          else
            git commit -m "Automated rankings refresh: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
