name: Refresh rankings data

on:
  schedule:
    # Daily at 11:17 UTC (07:17 EDT / 06:17 EST); schedules can be delayed by GitHub.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: 'Season override (blank uses the active football season)'
        required: false
        default: ''

concurrency:
  group: refresh-rankings-data
  cancel-in-progress: false

permissions:
  contents: write

env:
  CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
  SUPABASE_URL: https://wmlzqmtsxqqxuiekmrqm.supabase.co
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select and validate season
        env:
          REQUESTED_SEASON: ${{ inputs.season }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          requested = os.environ.get('REQUESTED_SEASON', '').strip()
          season = int(requested) if requested else now.year - (now.month < 8)
          if not 2014 <= season <= now.year:
              raise SystemExit('Season must be between 2014 and the current year')
          if not os.environ.get('CFBD_API_KEY'):
              raise SystemExit('Repository secret CFBD_API_KEY is required')
          if not os.environ.get('SUPABASE_SECRET_KEY'):
              raise SystemExit('Repository secret SUPABASE_SECRET_KEY is required for private premium publication')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'SEASON={season}\n')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[models]'

      # Hydrate the private publication fixture before tests. These files are
      # gitignored and exist only on this trusted runner.
      - name: Hydrate private premium history
        run: python scripts/hydrate_premium_data.py
      - name: Test publication gates
        run: python -m unittest discover -s tests

      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
          key: cfb-kenpom-data-v2-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: |
            cfb-kenpom-data-v2-${{ env.SEASON }}-

      # Force refresh is essential: without it, verified cached partitions can
      # permanently retain incomplete game results and empty future weeks.
      - name: Refresh source data
        run: python -m cfb_analytics.pipelines.ingest --season "$SEASON" --force
      - name: Materialize canonical plays
        run: python -m cfb_analytics.raw.cli canonical-plays --season "$SEASON"
      - name: Materialize derived drives
        run: python -m cfb_analytics.raw.cli derived-drives --season "$SEASON"
      - name: Refresh FBS membership facts
        run: python -m cfb_analytics.pipelines.ingest_facts --season "$SEASON" --force
      - name: Derive metrics
        run: python -m cfb_analytics.pipelines.calculate_metrics --season "$SEASON"
      - name: Propagate dropback metrics
        run: python -m cfb_analytics.analytics.dropback_propagation_cli propagate --season "$SEASON"
      - name: Propagate yardage metrics
        run: python -m cfb_analytics.derived.basic_yardage_propagation_cli materialize --season "$SEASON"
      - name: Propagate havoc metrics
        run: python -m cfb_analytics.derived.havoc_propagation_cli materialize --season "$SEASON"
      - name: Build canonical team games
        run: python -m cfb_analytics.pipelines.build_canonical --season "$SEASON"
      - name: Compute ratings
        run: python -m cfb_analytics.pipelines.calculate_ratings --season "$SEASON"
      - name: Compile and validate current season
        run: python scripts/compile_site_data.py --season "$SEASON"
      # No-ops until the one-time historical model freeze has been run
      # (prospective/2026/prediction-v2-2026-frozen.json does not exist yet).
      # Once frozen, this scores the next unscored early week from data
      # already on disk -- no CFBD_API_KEY needed at this step.
      - name: Score weekly predictions
        run: python -m cfb_analytics.pipelines.weekly_predictions
      - name: Export Next.js data
        run: python scripts/export_web_data.py
      - name: Audit every published season
        run: python scripts/validate_site_data.py
      - name: Publish premium data to Supabase
        run: python scripts/publish_premium_data.py --season "$SEASON"

      # GITHUB_TOKEN commits do not trigger other GitHub push workflows, so
      # validation must finish in this job before publication.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run build
        working-directory: web

      - name: Remove private build artifacts
        run: |
          rm -f site/advanced-data.js
          rm -rf web/public/data/advanced web/public/data/predictions

      - name: Commit validated public changes
        id: publish
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Prediction snapshots are exclusive-create (never overwritten) --
          # committing them is what makes that immutability durable across
          # runs instead of depending on ephemeral CI cache retention, and is
          # also how weekly_predictions.py knows which weeks are already
          # scored. mkdir ensures the path exists even before the one-time
          # model freeze, so git add never fails on a missing directory.
          mkdir -p "prospective/$SEASON/predictions"
          git add "data/canonical/season=$SEASON" site/data.js site/search-index.js web/public/data "prospective/$SEASON/predictions"
          if git diff --staged --quiet; then
            echo "No public data changes; skipping commit." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh $SEASON ratings ($(date -u +%Y-%m-%d))"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Published validated $SEASON public ratings; premium data stayed in Supabase." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Optional after Vercel is connected. A deploy hook avoids depending on
      # bot-commit deployment behavior and is never exposed to browser code.
      - name: Notify Vercel of refreshed data
        if: steps.publish.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 -X POST "$DEPLOY_HOOK" --output /dev/null
          fi
