name: Refresh 2026 ratings and metrics

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh.yml"
  schedule:
    # Cheap metadata check every hour for newly completed/corrected games and
    # calendar rollover. Minute 17 avoids the busiest top-of-hour window.
    - cron: "17 * * * *"
    # Once daily, re-pull the latest two completed CFBD source weeks so silent
    # drive/PBP corrections are eventually incorporated even when scores do not change.
    - cron: "43 9 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-fetch every completed 2026 source partition"
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-rankings-data
  cancel-in-progress: false

permissions:
  contents: write

env:
  SEASON: "2026"
  CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
  SUPABASE_URL: https://wmlzqmtsxqqxuiekmrqm.supabase.co
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Allow scheduled and manual source checks
        id: gate
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Running source-freshness and calendar checks. Expensive rebuild work remains gated on an actual refresh partition." >> "$GITHUB_STEP_SUMMARY"

  detect-new-games:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      data_changes: ${{ steps.detect.outputs.data_changes }}
      new_games: ${{ steps.detect.outputs.new_games }}
      new_game_count: ${{ steps.detect.outputs.new_game_count }}
      changed_game_count: ${{ steps.detect.outputs.changed_game_count }}
      new_game_ids: ${{ steps.detect.outputs.new_game_ids }}
      corrected_game_ids: ${{ steps.detect.outputs.corrected_game_ids }}
      schedule_changed_game_ids: ${{ steps.detect.outputs.schedule_changed_game_ids }}
      refresh_partitions: ${{ steps.detect.outputs.refresh_partitions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Check CFBD for new/corrected data
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          args=()
          # Workflow-file changes are production-pipeline changes. Prove them
          # against every completed 2026 source partition, not only the latest
          # game, before treating the new workflow as production-ready. This is
          # also the final end-to-end proof path after integrity/audit changes.
          if [ "$EVENT_NAME" = "push" ]; then
            args+=(--refresh-all-completed)
          fi
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "43 9 * * *" ]; then
            args+=(--refresh-recent)
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FULL_REFRESH" = "true" ]; then
            args+=(--refresh-all-completed)
          fi
          python scripts/check_new_games.py --season "$SEASON" "${args[@]}"
      - name: Record no-source-change decision
        if: steps.detect.outputs.data_changes != 'true'
        run: |
          echo "No source partitions require a rebuild. The calendar rollover job will still verify currentWeek." >> "$GITHUB_STEP_SUMMARY"

  # `currentWeek` is calendar state, not rating state. If no source rebuild is
  # required, this tiny job still advances the committed schedule as soon as a
  # new site's first kickoff begins. That lets Ratings/Advanced synthesize the
  # new current week immediately instead of waiting for the first final score.
  calendar-rollover:
    needs: [schedule-gate, detect-new-games]
    if: needs.schedule-gate.outputs.should_run == 'true' && needs.detect-new-games.outputs.data_changes != 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize current schedule week
        id: calendar
        run: |
          python scripts/normalize_schedule_calendar.py --season "$SEASON"
          if git diff --quiet -- "web/public/data/schedule/$SEASON.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Schedule currentWeek is already correct." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Audit calendar-only candidate
        if: steps.calendar.outputs.changed == 'true'
        run: python scripts/audit_data_contracts.py
      - name: Commit calendar rollover
        if: steps.calendar.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "web/public/data/schedule/$SEASON.json"
          git commit -m "Advance $SEASON schedule to current site week"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Notify Vercel of calendar rollover
        if: steps.calendar.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 -X POST "$DEPLOY_HOOK" --output /dev/null
          fi

  refresh:
    needs: [schedule-gate, detect-new-games]
    if: needs.schedule-gate.outputs.should_run == 'true' && needs.detect-new-games.outputs.data_changes == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[models]'

      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
          key: cfb-kenpom-data-v3-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: |
            cfb-kenpom-data-v3-${{ env.SEASON }}-
            cfb-kenpom-data-v2-${{ env.SEASON }}-

      - name: Hydrate and verify private premium history
        run: python scripts/hydrate_premium_data.py

      - name: Fetch games, drives and play-by-play for changed partitions
        env:
          REFRESH_PARTITIONS: ${{ needs.detect-new-games.outputs.refresh_partitions }}
          CHANGED_GAME_COUNT: ${{ needs.detect-new-games.outputs.changed_game_count }}
        run: |
          CACHE_MARKER="data/raw/.refresh-cache-v3-complete"
          if [ ! -f "$CACHE_MARKER" ]; then
            echo "No trusted v3 season cache found; bootstrapping the complete $SEASON source corpus."
            python -m cfb_analytics.pipelines.ingest --season "$SEASON" --force
            mkdir -p "$(dirname "$CACHE_MARKER")"
            touch "$CACHE_MARKER"
          else
            args=()
            for partition in $REFRESH_PARTITIONS; do
              args+=(--refresh-partition "$partition")
            done
            if [ ${#args[@]} -eq 0 ]; then
              echo "Refresh was requested but no source partitions were resolved." >&2
              exit 1
            fi
            echo "Refreshing $CHANGED_GAME_COUNT selected game(s) in: $REFRESH_PARTITIONS"
            python -m cfb_analytics.pipelines.ingest --season "$SEASON" "${args[@]}"
          fi

      - name: Clean and materialize canonical plays
        run: python -m cfb_analytics.raw.cli canonical-plays --season "$SEASON"
      - name: Materialize derived drives
        run: python -m cfb_analytics.raw.cli derived-drives --season "$SEASON"
      - name: Refresh FBS membership facts
        run: python -m cfb_analytics.pipelines.ingest_facts --season "$SEASON" --force
      - name: Derive all 2026 metrics
        run: python -m cfb_analytics.pipelines.calculate_metrics --season "$SEASON"
      - name: Propagate dropback metrics
        run: python -m cfb_analytics.analytics.dropback_propagation_cli propagate --season "$SEASON"
      - name: Propagate yardage metrics
        run: python -m cfb_analytics.derived.basic_yardage_propagation_cli materialize --season "$SEASON"
      - name: Propagate havoc metrics
        run: python -m cfb_analytics.derived.havoc_propagation_cli materialize --season "$SEASON"
      - name: Rebuild canonical 2026 team games
        run: python -m cfb_analytics.pipelines.build_canonical --season "$SEASON"
      - name: Recompute 2026 ratings
        run: python -m cfb_analytics.pipelines.calculate_ratings --season "$SEASON"
      - name: Compile 2026 hierarchical HFA ratings and Advanced metrics
        run: python scripts/compile_site_data.py --season "$SEASON" --rating-model hierarchical_hfa

      - name: Score weekly predictions
        run: python -m cfb_analytics.pipelines.weekly_predictions
      - name: Score early-season predictions
        run: python -m cfb_analytics.pipelines.early_season_predictions publish
      - name: Export Next.js data
        run: python scripts/export_web_data.py
      - name: Normalize schedule calendar week
        run: python scripts/normalize_schedule_calendar.py --season "$SEASON"

      - name: Test publication gates
        run: python -m unittest discover -s tests
      - name: Assert current-season-only rating contract
        run: python -m unittest discover -s tests -p 'test_current_season_rating_contract.py'
      - name: Audit rating/model contracts
        run: python scripts/validate_site_data.py
      - name: Audit cross-artifact contracts
        run: python scripts/audit_data_contracts.py --require-private

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Lint and build Next.js production app
        run: npm run lint && npm run build
        working-directory: web

      - name: Publish live CFP chance into Advanced Analytics candidate
        run: python scripts/publish_cfp_chance.py --season "$SEASON"
        continue-on-error: true
      - name: Re-audit private candidate after CFP mutation
        run: python scripts/audit_data_contracts.py --require-private
      - name: Publish validated premium data to Supabase
        run: python scripts/publish_premium_data.py --season "$SEASON"

      - name: Remove private build artifacts
        run: |
          rm -f site/advanced-data.js
          rm -rf web/public/data/advanced web/public/data/predictions

      - name: Commit validated 2026 changes
        id: publish
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          CHANGED_GAME_COUNT: ${{ needs.detect-new-games.outputs.changed_game_count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "prospective/$SEASON/predictions"
          git add "data/canonical/season=$SEASON" site/data.js site/search-index.js web/public/data "prospective/$SEASON/predictions"
          if git diff --staged --quiet; then
            echo "Refresh completed and validated, but the publishable output did not change." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh $SEASON data after $CHANGED_GAME_COUNT source game(s)"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Published refreshed $SEASON data after validating all public/private contracts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify Vercel of refreshed data
        if: steps.publish.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 -X POST "$DEPLOY_HOOK" --output /dev/null
          fi
