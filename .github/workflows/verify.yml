name: Verify site and ratings
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Separate from `verify` deliberately: the main job installs '.[models,dev]'
  # and must not also carry Pillow (and its system-level imaging libs) just
  # for the handful of social-post tests. Without this job, the Pillow-
  # dependent renderer tests only ever *skip* under '.[models,dev]' -- which
  # means the actual rankings-graphic code path was never exercised by CI at
  # all, the exact kind of gap that passes locally and breaks unattended on
  # a Sunday.
  social-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analytics package with social extras
        run: pip install -e '.[social]'
      - name: Run social/Pillow-dependent tests
        run: python -m unittest tests.test_generate_rankings_post -v

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analytics package
        run: pip install -e '.[models,dev]'
      - name: Run full Python test suite
        run: python -m unittest discover -s tests
      - name: Assert current-season-only rating contract
        run: python -m unittest discover -s tests -p 'test_current_season_rating_contract.py'
      - name: Validate published rating artifacts
        run: python scripts/validate_site_data.py
      - name: Audit cross-artifact data contracts
        run: python scripts/audit_data_contracts.py
      - name: Audit completed-game results contract
        run: python scripts/audit_game_results_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Custom-sample calculation tests
        run: npm test
        working-directory: web
      - name: Lint and build Next.js production app
        run: npm run lint && npm run build
        working-directory: web
