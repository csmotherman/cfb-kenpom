name: Verify site and ratings
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analytics package
        run: pip install -e '.[models]'
      - name: Run full Python test suite
        run: python -m unittest discover -s tests
      - name: Assert current-season-only rating contract
        run: python -m unittest discover -s tests -p 'test_current_season_rating_contract.py'
      - name: Validate published rating artifacts
        run: python scripts/validate_site_data.py
      - name: Audit cross-artifact data contracts
        run: python scripts/audit_data_contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Lint and build Next.js production app
        run: npm run lint && npm run build
        working-directory: web
