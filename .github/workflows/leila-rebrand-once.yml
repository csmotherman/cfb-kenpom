name: One-time LEILA Ratings rebrand

on:
  push:
    branches:
      - leila-ratings-rebrand

permissions:
  contents: write

jobs:
  rebrand:
    if: github.event.head_commit.message == 'Run one-time LEILA Ratings rebrand'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy brand references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          repo = Path('.')
          text_suffixes = {
              '.ts', '.tsx', '.js', '.jsx', '.css', '.md', '.json', '.py',
              '.yml', '.yaml', '.html', '.txt', '.toml', '.mjs', '.cjs'
          }

          # Remove the old browser-side terminology patcher. Rebrand the source
          # itself instead of carrying a component named after the retired brand.
          layout = repo / 'web/app/layout.tsx'
          layout_text = layout.read_text(encoding='utf-8')
          layout_text = layout_text.replace('import GridTerminologyGuard from "@/components/GridTerminologyGuard";\n', '')
          layout_text = layout_text.replace('        <GridTerminologyGuard />\n', '')
          layout.write_text(layout_text, encoding='utf-8')

          legacy_guard = repo / 'web/components/GridTerminologyGuard.tsx'
          if legacy_guard.exists():
              legacy_guard.unlink()

          # Preserve the exact logo artwork from the user's brand commit and
          # rename only the stale file paths.
          renames = [
              ('web/public/brand/grid-logo.png', 'web/public/brand/leila-ratings-logo.png'),
              ('web/styles/grid-brand.css', 'web/styles/leila-brand.css'),
          ]
          for old, new in renames:
              old_path, new_path = repo / old, repo / new
              if old_path.exists():
                  new_path.parent.mkdir(parents=True, exist_ok=True)
                  old_path.rename(new_path)

          literal_replacements = [
              ('@/styles/grid-brand.css', '@/styles/leila-brand.css'),
              ('/brand/grid-logo.png', '/brand/leila-ratings-logo.png'),
              ('applyGridTitle', 'normalizeLeilaTitle'),
              ('LEILA RATINGS', 'LEILA Ratings'),
              ('GRID | College Football Analytics', 'LEILA Ratings | College Football Analytics'),
              ('GRID Pro', 'LEILA Pro'),
              ("GRID's AdjNet", "LEILA's Adj. Net"),
              ("GRID’s AdjNet", "LEILA’s Adj. Net"),
              ("GRID's opponent-adjusted", "LEILA's opponent-adjusted"),
              ("GRID’s opponent-adjusted", "LEILA’s opponent-adjusted"),
              ('GRID AdjNet', 'LEILA Adj. Net'),
              ('GRID AdjOff', 'LEILA Adj. Off'),
              ('GRID AdjDef', 'LEILA Adj. Def'),
              ('GRID Rankings', 'LEILA Ratings'),
              ('GRID Ratings', 'LEILA Ratings'),
              ('GRID Rating', 'LEILA Rating'),
              ('GRID Relative Performance Index', 'LEILA Relative Performance Ratings'),
              ("GRID's", "LEILA's"),
              ('GRID’s', 'LEILA’s'),
          ]

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in tracked:
              if not name:
                  continue
              path = repo / name
              if not path.exists() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in literal_replacements:
                  text = text.replace(old, new)

              # Rename legacy brand-prefixed environment/config identifiers
              # without producing invalid identifiers containing spaces.
              text = re.sub(r'\bGRID_([A-Z0-9_]+)\b', r'LEILA_\1', text)

              # Replace standalone brand mentions only. This deliberately does
              # not touch valid lowercase CSS `grid` layout syntax.
              text = re.sub(r'(?<![A-Za-z0-9_])GRID(?![A-Za-z0-9_])', 'LEILA Ratings', text)

              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Smooth out prominent UI copy so the rebrand reads like a product,
          # not a mechanical find-and-replace.
          targeted = {
              'web/app/layout.tsx': [
                  ('"LEILA Ratings provides opponent-adjusted college football AdjNet ratings,', '"LEILA Ratings provides opponent-adjusted college football ratings,'),
              ],
              'web/app/page.tsx': [
                  ('aria-label="LEILA Ratings Adj. Net college football ratings table"', 'aria-label="LEILA Ratings college football ratings table"'),
                  ('LEILA Relative Performance Ratings college football ratings', 'LEILA Ratings college football rankings'),
              ],
              'web/components/SiteHeader.tsx': [
                  ('aria-label="LEILA Ratings — College Football Analytics home"', 'aria-label="LEILA Ratings home"'),
              ],
          }
          for name, pairs in targeted.items():
              path = repo / name
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # Delete this one-time migration workflow from the resulting branch.
          workflow = repo / '.github/workflows/leila-rebrand-once.yml'
          if workflow.exists():
              workflow.unlink()

          # Source-level brand audit. Lowercase CSS `grid` remains because it is
          # browser layout syntax, not the retired product name.
          offenders = []
          for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not name:
                  continue
              path = repo / name
              if not path.exists() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if re.search(r'\bGRID\b', text) or 'GridTerminologyGuard' in text or 'grid-brand.css' in text or 'grid-logo.png' in text:
                  offenders.append(name)
          if offenders:
              raise SystemExit('Legacy brand references remain in: ' + ', '.join(offenders))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Verify LEILA build
        run: npm run lint && npm run build
        working-directory: web

      - name: Commit rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand GRID to LEILA Ratings"
          git push origin HEAD:leila-ratings-rebrand
